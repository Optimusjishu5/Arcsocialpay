[profile.default]
src = "contracts"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["lib"]
cache_path = "contracts/cache"
# Keep solc 0.8.28 / paris: contracts target Arc (pre-Cancun compatible EVM); do not bump without re-auditing bytecode.
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
ethereum = "https://ethereum-rpc.publicnode.com"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
base = "https://base-rpc.publicnode.com"
base_sepolia = "https://base-sepolia-rpc.publicnode.com"
arbitrum = "https://arbitrum-one-rpc.publicnode.com"
polygon = "https://polygon-bor-rpc.publicnode.com"
optimism = "https://optimism-rpc.publicnode.com"
arc = "https://rpc.mainnet.arc.io"
arc_mainnet = "https://rpc.mainnet.arc.io"
# Legacy alias — points at Arc Mainnet (Chain ID 5042). Testnet is retired.
arc_testnet = "https://rpc.mainnet.arc.io"

# Verifier placeholder: set ARCSCAN_API_KEY in .env (see .env.example). URL is a placeholder until ArcScan publishes one.
[etherscan]
arc = { key = "${ARCSCAN_API_KEY}", url = "https://api.arcscan.app/api" }
arc_mainnet = { key = "${ARCSCAN_API_KEY}", url = "https://api.arcscan.app/api" }
arc_testnet = { key = "${ARCSCAN_API_KEY}", url = "https://api.arcscan.app/api" }
